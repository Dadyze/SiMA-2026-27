# Statička adresa (server, mrežni štampač, ruter: uređaji čija se adresa ne smije mijenjati).
# Na pravoj mašini: ime sučelja (eth0, enp0s3 ...) se vidi naredbom: ip -br link
network:
  version: 2
  renderer: networkd
  ethernets:
    eth0:
      dhcp4: false
      addresses:
        - 192.168.1.10/24
      routes:
        - to: default
          via: 192.168.1.1
      nameservers:
        addresses: [192.168.1.1, 1.1.1.1]
        search: [lan]
