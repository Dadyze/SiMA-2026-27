# v3/p3: automatsko čišćenje privremenih datoteka (Linux ekvivalent Windows "Storage Sense").
# Format tmpfiles.d: tip  putanja  prava  vlasnik  grupa  starost
#   d  = napravi direktorij ako ne postoji; pri čišćenju (systemd-tmpfiles --clean) briše sadržaj stariji od "starost"
#   m: = starost se računa po vremenu zadnje izmjene (mtime)
# Na pravom sistemu datoteka ide u /etc/tmpfiles.d/, a čišćenje pokreće systemd-tmpfiles-clean.timer jednom dnevno.
d /var/tmp/sima-temp 0755 root root m:7d
